[[mgr.prepend_keymap]]
on = "<C-p>"
run = "shell --orphan -- gtklp -i %s"
desc = "Print selected files"

[[mgr.prepend_keymap]]
on = ["g", "d"]
run = "cd /home/master/Downloads"
desc = "Go to download"

[[mgr.prepend_keymap]]
on = ["g", "c"]
run = "cd /home/master/.config"
desc = "Go to .config"

[[mgr.prepend_keymap]]
on = ["g", "s"]
run = "cd /home/master/Pictures/Screenshots/"
desc = "Go to Screenshot"

[[mgr.prepend_keymap]]
on = ["g", "D"]
run = "cd /home/master/Documents"
desc = "Go to Documents"

[[mgr.prepend_keymap]]
on = ["g", "h"]
run = "cd /home/master/"
desc = "Go home"

[[mgr.prepend_keymap]]
on = ["g", "n"]
run = "cd /mnt/new-volume/"
desc = "Go to new volume"

[[mgr.prepend_keymap]]
on = ["g", "p"]
run = "cd /home/master/Pictures/"
desc = "Go to  Pictures"

[[mgr.prepend_keymap]]
on = ["g", "r"]
run = "cd /run/media"
desc = "Go to removable media (directory must exist)"
