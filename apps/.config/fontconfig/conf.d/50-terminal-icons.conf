<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Keep JetBrains Mono text; use installed Nerd glyphs for terminal icons. -->
  <match target="pattern">
    <test name="family" compare="eq"><string>JetBrains Mono</string></test>
    <edit name="family" mode="append" binding="strong"><string>Symbols Nerd Font Mono</string></edit>
  </match>
</fontconfig>
